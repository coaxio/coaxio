<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Coaxio: open source homelab tooling, systems integrator and cloud architect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Coaxio: open source homelab tooling</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061C22"/>
      <stop offset="0.55" stop-color="#0A2A31"/>
      <stop offset="1" stop-color="#0D3A42"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E39A62" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#C87A44" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C87A44" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5EEAD4" opacity="0.07"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19" fill="none" stroke="#16515A"/>

    <!-- coaxial cross-section: jacket, braid, dielectric, copper core -->
    <g transform="translate(1064 160)">
      <circle r="98" fill="url(#coreGlow)"/>
      <circle r="88" fill="none" stroke="#16515A" stroke-width="9"/>
      <circle r="70" fill="none" stroke="#2A6B71" stroke-width="3" stroke-dasharray="7 9" opacity="0.85"/>
      <circle r="50" fill="none" stroke="#0F3A42" stroke-width="12"/>
      <circle r="50" fill="none" stroke="#1E5A62" stroke-width="1"/>

      <!-- signal arriving at the core, once per cycle -->
      <circle r="14" fill="none" stroke="#5EEAD4" stroke-width="2">
        <animate attributeName="r" values="14;14;96" keyTimes="0;0.9;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.9;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="15" fill="#C87A44" filter="url(#soft)" opacity="0.7"/>
      <circle r="13" fill="#C87A44">
        <animate attributeName="fill" values="#C87A44;#C87A44;#E9AE79" keyTimes="0;0.9;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- the trace: down the left rail, then straight into the core -->
    <path id="trace" d="M64 44 V160 H1050" fill="none" stroke="#16515A" stroke-width="1.5"/>
    <path d="M64 44 V160 H1050" fill="none" stroke="#C87A44" stroke-width="2" stroke-linecap="round"
          stroke-dasharray="70 1200">
      <animate attributeName="stroke-dashoffset" from="70" to="-1130" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle r="3.5" fill="#5EEAD4">
      <animateMotion dur="4s" repeatCount="indefinite" path="M64 44 V160 H1050"/>
    </circle>

    <g font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif">
      <text x="104" y="118" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
            font-size="15" fill="#5EEAD4" letter-spacing="1.5">coaxio.dev</text>

      <text x="102" y="192" font-size="72" font-weight="700" fill="#E8F4F2" letter-spacing="6">coaxio</text>

      <text x="104" y="230" font-size="19" fill="#B9D6D3">Open source homelab tooling.</text>

      <text x="104" y="262" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
            font-size="14" fill="#7FA7A5">Go for orchestrators, Rust when the protocol gets serious.</text>
    </g>
  </g>
</svg>